# Example of ~/.config/ms-kb/config.toml (note-schema-v0 §6).
# `kb setup` writes this file for you; KB_CONFIG overrides its location.
schema_version = 1
default_kb = "main"

[kbs.main]
vault_path = "~/Knowledge/main"

[clients]
enabled = ["claude-code", "codex", "cursor"]

# Optional (design §12.3): kb sync pushes the vault's own Git repository to this
# remote. kb setup --remote URL writes it; credentials are never stored here.
[kbs.main.sync]
provider = "git"
remote = "origin"
