[project]
name = "ms-kb"
version = "0.2.0"
description = "Personal knowledge base on Obsidian with skills for Claude Code, Codex and Cursor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tomli-w>=1.0"]

[project.scripts]
kb = "ms_kb.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ms_kb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
