name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run pytest
      - run: uv build
      - name: Install the built wheel as a tool
        run: |
          uv tool install dist/*.whl
          kb --version
      - name: Smoke test the installed CLI on a temporary vault
        env:
          KB_CONFIG: ${{ runner.temp }}/kb/config.toml
          VAULT: ${{ runner.temp }}/vault
          HOME: ${{ runner.temp }}/home
          REMOTE: ${{ runner.temp }}/remote.git
          CLONE: ${{ runner.temp }}/clone
        run: |
          mkdir -p "$HOME"
          git init -q --bare -b main "$REMOTE"
          kb setup --vault "$VAULT" --clients claude-code,codex --yes --remote "$REMOTE" --no-schedule
          kb init
          kb doctor
          test "$(kb where)" = "$(cd "$VAULT" && pwd -P)"
          test -f "$VAULT/templates/concept.md"
          test -f "$VAULT/learning_profile.md"
          test -f "$HOME/.claude/skills/add-knowledge/SKILL.md"
          test -f "$HOME/.agents/skills/add-knowledge/SKILL.md"
          printf '## Explanation\nRetrieval plus generation.\n' \
            | kb new concept --title RAG --topic rag --skill add-knowledge --body-file -
          printf '## Insights\n- Reranking helps.\n' \
            | kb extend concepts/RAG.md --summary "Added an insight" --skill add-knowledge --body-file -
          if kb new concept --title rag --topic rag; then echo "duplicate was not refused"; exit 1; fi
          kb search rag --json | grep -q '"title": "RAG"'
          kb search --field updates.skill=add-knowledge | grep -q RAG.md
          kb validate
          # History: a commit per write with provenance trailers (design §12.1)
          git -C "$VAULT" log -1 --format=%B | grep -q 'Kb-Skill: add-knowledge'
          git -C "$VAULT" log --format=%s | grep -q 'kb: create concepts/RAG.md'
          # Secrets are refused
          if printf '## Explanation\nAKIAABCDEFGHIJKLMNOP\n' | kb new concept --title Keys --topic aws --body-file -; then
            echo "secret was not refused"; exit 1
          fi
          # Outside edits get their own commit; kb sync pushes
          echo "Edited outside kb." >> "$VAULT/concepts/RAG.md"
          kb sync
          git -C "$VAULT" log -1 --format=%s | grep -q '^external: '
          git -C "$REMOTE" log --format=%s main | grep -q 'kb: create concepts/RAG.md'
          # A deleted note is reported and restored
          rm "$VAULT/concepts/RAG.md"
          if kb doctor; then echo "deletion was not reported"; exit 1; fi
          kb restore concepts/RAG.md
          test -f "$VAULT/concepts/RAG.md"
          kb doctor
          kb history concepts/RAG.md | grep -q 'kb: create concepts/RAG.md'
          # The vault survives losing the local folder
          git clone -q "$REMOTE" "$CLONE"
          test -f "$CLONE/concepts/RAG.md"
