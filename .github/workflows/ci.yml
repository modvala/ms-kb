name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run pytest
      - run: uv build
      - name: Install the built wheel as a tool
        run: |
          uv tool install dist/*.whl
          kb --version
      - name: Smoke test the installed CLI on a temporary vault
        env:
          KB_CONFIG: ${{ runner.temp }}/kb/config.toml
          VAULT: ${{ runner.temp }}/vault
        run: |
          kb setup --vault "$VAULT" --clients claude-code --yes
          kb init
          kb doctor
          test "$(kb where)" = "$(cd "$VAULT" && pwd -P)"
          test -f "$VAULT/templates/concept.md"
          test -f "$VAULT/learning_profile.md"
